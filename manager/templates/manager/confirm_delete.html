{% extends 'manager/base.html' %}
{% block title %}Delete | Team Task Manager{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;margin:0 auto;">
  <h1>Confirm delete</h1>
  <p>Are you sure you want to delete this {{ type }}: <strong>{{ object }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn secondary" href="javascript:history.back()">Cancel</a>
  </form>
</div>
{% endblock %}
