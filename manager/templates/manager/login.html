{% extends 'manager/base.html' %}
{% block title %}Login | Team Task Manager{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:40px auto;">
  <h1>Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Create one here</a>.</p>
</div>
{% endblock %}
