{% extends 'manager/base.html' %}
{% block title %}{{ title }} | Team Task Manager{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;margin:0 auto;">
  <h1>{{ title }}</h1>
  <p class="muted">Project: {{ project.name }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url 'project_detail' project.id %}">Cancel</a>
  </form>
</div>
{% endblock %}
