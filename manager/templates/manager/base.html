<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team Task Manager{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f7fb; color:#1f2937; }
    .container { max-width:1100px; margin:0 auto; padding:24px; }
    .nav { background:#111827; color:white; }
    .nav .container { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .nav a { color:white; text-decoration:none; margin-right:14px; }
    .card { background:white; border-radius:14px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.08); margin-bottom:18px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
    .btn { display:inline-block; background:#2563eb; color:white; padding:10px 14px; border:none; border-radius:10px; text-decoration:none; cursor:pointer; }
    .btn.secondary { background:#475569; }
    .btn.danger { background:#dc2626; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; box-sizing:border-box; margin-top:6px; margin-bottom:14px; }
    label { font-weight:bold; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #e5e7eb; vertical-align:top; }
    .muted { color:#6b7280; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#e5e7eb; font-size:12px; }
    .msg { padding:10px 14px; border-radius:10px; margin-bottom:12px; }
    .success { background:#dcfce7; }
    .error { background:#fee2e2; }
    .info { background:#dbeafe; }
    .row { display:grid; grid-template-columns: 2fr 1fr; gap:16px; }
    @media (max-width: 900px){ .row { grid-template-columns:1fr; } .nav .container { flex-direction:column; align-items:flex-start; } }
  </style>
</head>
<body>
  <div class="nav">
    <div class="container">
      <div><strong>Team Task Manager</strong></div>
      <div>
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}">Dashboard</a>
          <a href="{% url 'project_list' %}">Projects</a>
          <a href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a href="{% url 'login' %}">Login</a>
          <a href="{% url 'signup' %}">Signup</a>
        {% endif %}
      </div>
    </div>
  </div>
  <div class="container">
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
